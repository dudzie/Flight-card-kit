<style>
/* ---------- Product Designer Gym tokens (Light theme) ---------- */
:root {
  color-scheme: light;
  --primary: #E4F222;
  --primary-hover: #D3E10F;
  --on-primary: #1A1919;
  --primary-text: #5A6200;
  --primary-text-hover: #1A1919;
  --focus-ring: #1A1919;
  --background: #F4F2EE;
  --surface: #FFFFFF;
  --text: #1A1919;
  --text-muted: #5F5B55;
  --border: #D9D5CE;
  --success: #157A43;
  --warning: #8F5A00;
  --error: #C62828;
  --on-error: #FFFFFF;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-1: 4px; --radius-2: 8px; --radius-3: 12px; --radius-4: 16px;
  --radius-5: 24px; --radius-full: 9999px;
  --border-width: 1px; --focus-ring-width: 2px;
  --font-sans: "DM Sans", sans-serif;
}

/* ---------- Type styles ---------- */
.h1 { font: 700 40px/48px var(--font-sans); }
.h3 { font: 600 24px/32px var(--font-sans); }
.h4 { font: 600 20px/28px var(--font-sans); }
.body { font: 400 16px/24px var(--font-sans); }
.caption { font: 400 14px/20px var(--font-sans); }
.small { font: 400 12px/16px var(--font-sans); }
@media (max-width: 600px) { .h1 { font-size: 32px; line-height: 40px; } }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--background); }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--background); color: var(--text); font-family: var(--font-sans); }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: var(--focus-ring-width) solid var(--focus-ring); outline-offset: 2px; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 var(--space-4); }
@media (min-width: 720px) { .wrap { padding: 0 var(--space-6); } }

/* ---------- Components (from the PDG bundle) ---------- */
.pdg-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 40px; padding: 0 var(--space-4); border: var(--border-width) solid transparent; border-radius: var(--radius-2); font-weight: 600; cursor: pointer; text-decoration: none; transition: background-color .12s, border-color .12s, color .12s; }
.pdg-btn--primary { background: var(--primary); color: var(--on-primary); }
.pdg-btn--primary:hover { background: var(--primary-hover); }
.pdg-btn--secondary { background: transparent; color: var(--text); border-color: var(--text-muted); }
.pdg-btn--secondary:hover { border-color: var(--primary-text-hover); color: var(--primary-text-hover); }
.pdg-btn--ghost { background: transparent; color: var(--primary-text); padding: 0 var(--space-2); }
.pdg-btn--ghost:hover { color: var(--primary-text-hover); text-decoration: underline; }
.pdg-btn:disabled { background: var(--surface); color: var(--text-muted); border-color: var(--border); cursor: not-allowed; }
.pdg-btn svg { width: 18px; height: 18px; flex: none; }

.pdg-card { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); background: var(--surface); border: var(--border-width) solid var(--border); border-radius: var(--radius-3); color: var(--text); }
.pdg-card__title { margin: 0; }
.pdg-card__meta { margin: 0; color: var(--text-muted); }
.pdg-card__body { margin: 0; color: var(--text); }
.pdg-card__actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }

.pdg-badge { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-2); border: var(--border-width) solid currentColor; border-radius: var(--radius-1); background: var(--surface); font-weight: 600; }
.pdg-badge--success { color: var(--success); }
.pdg-badge--warning { color: var(--warning); }
.pdg-badge--error { color: var(--error); }
.pdg-badge--neutral { color: var(--text-muted); }

/* ---------- Header ---------- */
.site-header { padding: var(--space-5) 0; }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.brand { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--text); text-decoration: none; }
.brand__mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-2); background: var(--primary); color: var(--on-primary); }
.brand__mark svg { width: 18px; height: 18px; }
.header-meta { display: flex; align-items: center; gap: var(--space-2); color: var(--text-muted); }

/* ---------- Prompt ---------- */
.hero { padding: var(--space-6) 0 var(--space-5); }
@media (min-width: 720px) { .hero { padding-top: var(--space-7); } }
.hero__title { margin-bottom: var(--space-2); }
.hero__lede { color: var(--text-muted); margin-bottom: var(--space-5); max-width: 560px; }

.prompt { background: var(--surface); border: var(--border-width) solid var(--border); border-radius: var(--radius-4); padding: var(--space-3); transition: border-color .12s; }
.prompt:hover { border-color: var(--text-muted); }
.prompt:focus-within { border-color: var(--focus-ring); box-shadow: 0 0 0 1px var(--focus-ring); }
.prompt__input { display: block; width: 100%; min-height: 72px; max-height: 240px; resize: none; padding: var(--space-2) var(--space-2); background: transparent; color: var(--text); border: 0; outline: none; }
.prompt__input::placeholder { color: var(--text-muted); }
.prompt__bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding-top: var(--space-2); }
.context { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); background: var(--background); color: var(--text-muted); }
.chip svg { width: 14px; height: 14px; flex: none; }


/* ---------- Results ---------- */
.results { padding: var(--space-5) 0 var(--space-7); }
.results__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); min-height: 40px; }
.results__status { display: flex; align-items: center; gap: var(--space-2); color: var(--text-muted); }
.query { display: flex; gap: var(--space-3); align-items: flex-start; margin-bottom: var(--space-4); padding: var(--space-4); border-radius: var(--radius-3); background: var(--surface); border: var(--border-width) solid var(--border); }
.query__label { color: var(--text-muted); display: block; margin-bottom: var(--space-1); }
.query__avatar { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: var(--radius-full); background: var(--background); color: var(--text-muted); }
.query__avatar svg { width: 16px; height: 16px; }

/* The canvas the AI places cards on */
.canvas { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
@media (min-width: 720px) { .canvas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
/* Add class="span-2" to a card that should take the full row */
@media (min-width: 720px) { .canvas > .span-2 { grid-column: 1 / -1; } }


/* Placeholder slot, swapped out for participants' cards */
.slot { min-height: 200px; justify-content: center; align-items: center; text-align: center; border-style: dashed; background: transparent; }
.slot__num { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--primary); color: var(--on-primary); font-weight: 700; }
.slot .pdg-card__meta { max-width: 260px; }

/* Loading skeleton */
.skeleton { min-height: 200px; background: var(--surface); border: var(--border-width) solid var(--border); border-radius: var(--radius-3); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
.skeleton i { display: block; height: 12px; border-radius: var(--radius-1); background: var(--background); animation: pulse 1.2s ease-in-out infinite; }
.skeleton i:nth-child(1) { width: 40%; height: 20px; }
.skeleton i:nth-child(2) { width: 85%; }
.skeleton i:nth-child(3) { width: 65%; }
@keyframes pulse { 50% { opacity: .45; } }
.spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: var(--radius-full); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.card-in { animation: rise .35s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .skeleton i, .spinner, .card-in { animation: none; } }

main { flex: 1; }
.site-footer { padding: var(--space-5) 0 var(--space-6); color: var(--text-muted); border-top: var(--border-width) solid var(--border); }
</style>

.inline-form .pdg-input { flex: 1; min-width: 160px; }
.pdg-input { box-sizing: border-box; padding: var(--space-2) var(--space-3); min-height: 40px; background: var(--surface); color: var(--text); border: var(--border-width) solid var(--border); border-radius: var(--radius-2); font: inherit; }
.pdg-input:hover { border-color: var(--text-muted); }

/* Lists inside cards */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-top: var(--border-width) solid var(--border); }
.list li:first-child { border-top: 0; padding-top: 0; }
.list li:last-child { padding-bottom: 0; }
.list__main { display: flex; flex-direction: column; min-width: 0; }

/* Toggle */
.toggle { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); cursor: pointer; }
.toggle input { appearance: none; width: 44px; height: 24px; flex: none; border-radius: var(--radius-full); background: var(--border); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: var(--radius-full); background: var(--surface); transition: transform .15s; }
.toggle input:checked { background: var(--text); }
.toggle input:checked::after { transform: translateX(20px); }

/* Unknown case */
.pill-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.pill { display: inline-flex; align-items: center; min-height: 36px; padding: var(--space-1) var(--space-3); border: var(--border-width) solid var(--border); border-radius: var(--radius-full); background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; text-align: left; }
.pill:hover { border-color: var(--text-muted); }
.pill.is-on { background: var(--text); color: var(--surface); border-color: var(--text); }
.pill svg { width: 14px; height: 14px; flex: none; margin-right: 6px; }
.pill-date { position: relative; display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.pill-date__input { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
.pill-date__input.is-shown { position: static; width: auto; height: 36px; opacity: 1; pointer-events: auto; padding: 0 var(--space-2); border: var(--border-width) solid var(--border); border-radius: var(--radius-full); background: var(--surface); color: var(--text); font: inherit; }
.suggest { display: flex; flex-direction: column; gap: var(--space-2); }
.suggest button { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-3) var(--space-4); border: var(--border-width) solid var(--border); border-radius: var(--radius-2); background: var(--background); color: var(--text); cursor: pointer; text-align: left; }
.suggest button:hover { border-color: var(--text-muted); }

/* Facilitator note */
.case-tag { display: inline-flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-2); border-radius: var(--radius-1); border: var(--border-width) dashed var(--text-muted); color: var(--text-muted); }

/* Question card: what we know so far */
.known { gap: var(--space-1) var(--space-2); }
.known__chip { display: inline-flex; padding: 2px var(--space-2); border-radius: var(--radius-1); background: var(--background); border: var(--border-width) solid var(--border); font-weight: 600; color: var(--text); }
button.known__chip { cursor: pointer; font: inherit; font-weight: 600; }
button.known__chip:hover { border-color: var(--text-muted); }

/* Trip card: what the AI understood, tap to change */
.trip { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.trip__chip { display: inline-flex; align-items: center; gap: var(--space-1); min-height: 32px; padding: var(--space-1) var(--space-3); border-radius: var(--radius-full); border: var(--border-width) solid var(--border); background: var(--surface); color: var(--text); font-weight: 600; cursor: pointer; }
.trip__chip:hover { border-color: var(--text-muted); }
.trip__icon { width: 12px; height: 12px; color: var(--text-muted); }
.trip__chip--need { border-style: dashed; }
.trip__x { font-size: 16px; line-height: 1; color: var(--text-muted); }

/* Sort control on a group label */
.group-label { align-items: flex-end; }
.group-label > div { display: flex; flex-direction: column; }
.sort { display: inline-flex; align-items: center; gap: var(--space-2); }
.sort-select { min-height: 32px; padding: 0 var(--space-2); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="homepage.html" aria-label="PDG Flights home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
      </span>
      <span class="h4">PDG Flights</span>
    </a>
    <span class="small header-meta">A Product Designer Gym exercise</span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1 class="h1 hero__title">Where do you need to go?</h1>
      <p class="body hero__lede">Tell us in your own words. We'll work out the rest and show you what you need.</p>

      <form class="prompt" id="prompt-form" autocomplete="off">
        <label class="visually-hidden" for="prompt">Describe your trip</label>
        <textarea class="body prompt__input" id="prompt" rows="2" placeholder="e.g. Get me to Lisbon this weekend for under £150"></textarea>
        <div class="prompt__bar">
          <div class="context">
            <span class="chip small">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
              Using your location
            </span>
            <span class="chip small" id="today-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              <span>Today</span>
            </span>
          </div>
          <button class="pdg-btn pdg-btn--primary body" type="submit" id="submit" disabled>
            Search
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </form>

    </div>
  </section>

  <section class="results" id="results" aria-labelledby="results-title" hidden>
    <div class="wrap">
      <div class="results__head">
        <h2 class="h4" id="results-title">Your results</h2>
        <button class="pdg-btn pdg-btn--ghost caption" type="button" id="reset" hidden>Start over</button>
      </div>

      <div id="query" hidden></div>
      <p class="visually-hidden" aria-live="polite" id="live"></p>

      <div class="canvas" id="canvas"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap small">PDG Flights is a fictional airline made for a Product Designer Gym workshop. No real flights are booked.</div>
</footer>

<script id="pdg-kit-js">
/* PDG Flights card kit + rules. Shared by lab/ and design-system/.
   window.PDGKit.render(text) checks the essentials, picks ONE result using RULES and returns its cards. */
(function () {
  /* ---------------- Icons ---------------- */
  var P = {
    plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    seat: '<path d="M16 21v-2a4 4 0 0 0-8 0v2"/><circle cx="12" cy="7" r="4"/>',
    wind: '<path d="M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/>',
    alert: '<path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18h.01"/>',
    pin: '<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
    car: '<path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="8" cy="17" r="1.5"/><circle cx="16" cy="17" r="1.5"/>',
    bed: '<path d="M3 18V6M3 13h18v5M21 13a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="10" r="2"/>',
    train: '<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2-4M15 21l2-4"/>',
    bus: '<rect x="4" y="4" width="16" height="13" rx="2"/><path d="M4 11h16M7 21v-4M17 21v-4"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
    bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/>',
    sparkle: '<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
    tag: '<path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/>'
  };
  function ic(name, cls) {
    return '<svg class="' + (cls || 'icon') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[name] + '</svg>';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------------- Time helpers (all relative to now, so the demo never goes stale) ---------------- */
  var NOW = new Date();
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function addMin(t, m) { return new Date(t.getTime() + m * 60000); }
  function soon(mins) { var t = addMin(NOW, mins); t.setMinutes(Math.ceil(t.getMinutes() / 5) * 5, 0, 0); return t; }
  function at(dayOffset, hhmm) { var t = new Date(NOW); t.setDate(t.getDate() + dayOffset); var p = hhmm.split(':'); t.setHours(+p[0], +p[1], 0, 0); return t; }
  function hm(t) { return pad(t.getHours()) + ':' + pad(t.getMinutes()); }
  function dayDiff(t) { var a = new Date(NOW); a.setHours(0, 0, 0, 0); var b = new Date(t); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 864e5); }
  function dayLabel(t) {
    var o = { weekday: 'short', day: 'numeric', month: 'short' };
    if (t.getFullYear() !== NOW.getFullYear()) o.year = 'numeric';
    var s = t.toLocaleDateString('en-GB', o);
    var d = dayDiff(t);
    return d === 0 ? 'Today, ' + s : d === 1 ? 'Tomorrow, ' + s : s;
  }
  function dur(m) { return Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : ''); }
  function until(t) { var m = Math.round((t - NOW) / 60000); var h = Math.floor(m / 60); return (h ? h + ' h ' : '') + (m % 60) + ' min'; }

  /* ---------------- Places ---------------- */
  var CITIES = {
    'london': ['LHR', 'London Heathrow', 0], 'manchester': ['MAN', 'Manchester', 60], 'edinburgh': ['EDI', 'Edinburgh', 80],
    'glasgow': ['GLA', 'Glasgow', 80], 'lisbon': ['LIS', 'Lisbon', 165], 'paris': ['CDG', 'Paris', 75], 'rome': ['FCO', 'Rome', 150],
    'barcelona': ['BCN', 'Barcelona', 125], 'amsterdam': ['AMS', 'Amsterdam', 70], 'berlin': ['BER', 'Berlin', 110],
    'dublin': ['DUB', 'Dublin', 75], 'madrid': ['MAD', 'Madrid', 140], 'new york': ['JFK', 'New York', 470],
    'porto': ['OPO', 'Porto', 140], 'krakow': ['KRK', 'Kraków', 150], 'nice': ['NCE', 'Nice', 120], 'athens': ['ATH', 'Athens', 225]
  };
  function findCity(t, after) {
    var best = null;
    Object.keys(CITIES).forEach(function (k) {
      var re = new RegExp((after ? '\\b' + after + '\\s+' : '\\b') + k + '\\b');
      if (re.test(t)) best = k;
    });
    return best;
  }

  /* ---------------- Cards (the kit) ---------------- */

  // AI note: one short sentence that frames what the cards below are.
  function aiNote(text) {
    return '<div class="ai-note">' + '<span class="ai-note__icon">' + ic('sparkle') + '</span><p class="body">' + text + '</p></div>';
  }

  // GROUP LABEL: heading over a run of Flight cards. sortable = the traveller can re-sort the run.
  function groupLabel(title, hint, sortable) {
    var sort = sortable ? '<label class="sort caption"><span class="muted">Sort</span><select class="pdg-input sort-select caption" aria-label="Sort these flights">' +
      [['best', 'Best first'], ['price', 'Cheapest'], ['dep', 'Leaves first'], ['arr', 'Lands first'], ['mins', 'Shortest']].map(function (o, i) { return '<option value="' + o[0] + '"' + (o[0] === sortable ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>' : '';
    return '<div class="group-label"><div><h3 class="h4">' + title + '</h3>' + (hint ? '<span class="caption">' + hint + '</span>' : '') + '</div>' + sort + '</div>';
  }
  // Re-sorts the Flight cards that follow a group label, in place.
  function sortRun(select) {
    var label = select.closest('.group-label'), run = [], el = label.nextElementSibling;
    while (el && el.classList.contains('flight')) { run.push(el); el = el.nextElementSibling; }
    var k = select.value === 'best' ? 'order' : select.value;
    run.sort(function (a, b) { return (+a.dataset[k]) - (+b.dataset[k]); });
    var after = label;
    run.forEach(function (c) { after.after(c); after = c; });
  }
  if (typeof document !== 'undefined') document.addEventListener('change', function (e) { if (e.target.classList && e.target.classList.contains('sort-select')) sortRun(e.target); });

  function badge(type, text) { return '<span class="pdg-badge pdg-badge--' + type + ' small">' + text + '</span>'; }

  // FLIGHT CARD: the common factor shared by every case.
  // f = { airline, code, from:[code,city], to:[code,city], dep:Date, mins, stops, via, price, badges:[], facts:[], primary, half }
  function flightCard(f) {
    var arr = addMin(f.dep, f.mins);
    var plus = dayDiff(arr) - dayDiff(f.dep);
    var logo = f.airline.split(' ').map(function (w) { return w[0]; }).join('').slice(0, 2);
    var stops = f.stops ? f.stops + ' stop' + (f.via ? ' · ' + f.via : '') : 'Direct';
    return '<article class="pdg-card flight' + (f.half ? ' half' : '') + '" data-order="' + (f.order || 0) + '" data-price="' + f.price + '" data-dep="' + f.dep.getTime() + '" data-arr="' + arr.getTime() + '" data-mins="' + f.mins + '">' +
      '<div class="flight__top"><div class="airline"><span class="airline__logo caption" aria-hidden="true">' + logo + '</span>' +
        '<div><p class="caption strong">' + f.airline + '</p><p class="small muted">' + f.code + ' · ' + dayLabel(f.dep) + '</p></div></div>' +
        (f.badges && f.badges.length ? '<div class="row">' + f.badges.join('') + '</div>' : '') + '</div>' +
      '<div class="route">' +
        '<div class="route__end"><span class="route__time">' + hm(f.dep) + '</span><span class="caption muted">' + f.from[0] + ' · ' + f.from[1] + '</span></div>' +
        '<div class="route__mid"><span class="small">' + dur(f.mins) + '</span><span class="route__line">' + (f.stops ? '<i></i>' : '') + '</span><span class="small">' + stops + '</span></div>' +
        '<div class="route__end route__end--arr"><span class="route__time">' + hm(arr) + (plus ? '<sup class="small"> +' + plus + '</sup>' : '') + '</span><span class="caption muted">' + f.to[0] + ' · ' + f.to[1] + '</span></div>' +
      '</div>' +
      '<div class="flight__bottom"><div class="flight__facts small">' + (f.facts || []).join('') + '</div>' +
        '<div class="flight__buy"><span class="price">£' + f.price + '<small>per person</small></span>' +
        '<button class="pdg-btn ' + (f.primary ? 'pdg-btn--primary' : 'pdg-btn--secondary') + ' body" type="button">Select</button></div></div>' +
    '</article>';
  }
  function fact(icon, text) { return '<span>' + ic(icon) + text + '</span>'; }

  // HIGHLIGHT CARD: one standout answer (used for Cheapest / Earliest).
  function highlightCard(h) {
    var arr = addMin(h.dep, h.mins);
    return '<article class="pdg-card highlight' + (h.labels && h.labels.length > 1 ? '' : ' half') + '">' +
      '<div class="row">' + (h.labels || [[h.icon, h.label]]).map(function (l) { return '<span class="highlight__label small">' + ic(l[0]) + l[1] + '</span>'; }).join('') + '</div>' +
      '<div class="spread"><div><p class="highlight__dest">' + h.to[1] + '</p><p class="caption muted">' + h.from[0] + ' → ' + h.to[0] + ' · ' + h.airline + '</p></div>' +
        '<span class="price">£' + h.price + '</span></div>' +
      '<dl class="facts caption">' +
        '<div><dt>Date</dt><dd>' + dayLabel(h.dep) + '</dd></div>' +
        '<div><dt>Departs</dt><dd>' + hm(h.dep) + ' → ' + hm(arr) + '</dd></div>' +
        '<div><dt>Duration</dt><dd>' + dur(h.mins) + '</dd></div>' +
        '<div><dt>Stops</dt><dd>' + (h.stops ? h.stops + ' stop' : 'Direct') + '</dd></div>' +
      '</dl>' +
      (h.note ? '<p class="caption muted">' + h.note + '</p>' : '') +
      '<div class="pdg-card__actions"><button class="pdg-btn pdg-btn--primary body" type="button">Select ' + h.to[1] + '</button></div>' +
    '</article>';
  }

  // TRIP CARD: everything the AI understood, as chips the traveller can tap to change.
  // items = [{ slot, text }] ; needs = [{ id, text }] (removable)
  function tripCard(items, needs) {
    return '<div class="trip"><span class="small muted">Your trip</span>' +
      items.map(function (k) { return '<button type="button" class="trip__chip caption" data-edit="' + k.slot + '" aria-label="Change ' + esc(k.text) + '">' + esc(k.text) + ic('pen', 'icon trip__icon') + '</button>'; }).join('') +
      (needs || []).map(function (n) { return '<button type="button" class="trip__chip trip__chip--need caption" data-drop="' + n.id + '" aria-label="Remove ' + esc(n.text) + '">' + esc(n.text) + '<span aria-hidden="true" class="trip__x">×</span></button>'; }).join('') +
    '</div>';
  }

  // STATUS CARD: what's happening, in one line, with a worded badge.
  function statusCard(s) {
    return '<article class="pdg-card status status--' + s.type + (s.half ? ' half' : '') + '">' +
      '<span class="status__icon">' + ic(s.icon) + '</span>' +
      '<div class="status__body"><div class="row">' + badge(s.type, s.badge) + '</div>' +
        '<h3 class="h4 pdg-card__title">' + s.title + '</h3><p class="body muted">' + s.body + '</p>' + (s.extra || '') + '</div>' +
    '</article>';
  }

  // AIRPORT CARD: nearest place you can actually fly from, with a simple map.
  function airportCard(a) {
    a = a || { you: 'Edinburgh', code: 'GLA', name: 'Glasgow', miles: 47, drive: '1 h 10 min', road: 'M8', roadNote: 'M8 open, slow near Harthill' };
    var t = 'style="font:600 11px var(--font-sans);fill:var(--text)"', m = 'style="font:400 10px var(--font-sans);fill:var(--text-muted)"';
    var map = '<svg class="map" viewBox="0 0 320 120" role="img" aria-label="Map: ' + esc(a.you) + ' to ' + esc(a.name) + ' airport, ' + a.miles + ' miles on the ' + esc(a.road) + '">' +
      '<path d="M262 64 C 220 70, 200 50, 160 58 S 90 70, 62 60" style="fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round"/>' +
      '<text x="160" y="48" text-anchor="middle" style="font:600 11px var(--font-sans);fill:var(--text-muted)">' + esc(a.road) + ' · ' + a.miles + ' mi</text>' +
      '<circle cx="262" cy="64" r="9" style="fill:var(--surface);stroke:var(--text);stroke-width:2"/><circle cx="262" cy="64" r="3.5" style="fill:var(--text)"/>' +
      '<text x="262" y="92" text-anchor="middle" ' + t + '>You</text><text x="262" y="106" text-anchor="middle" ' + m + '>' + esc(a.you) + '</text>' +
      '<rect x="48" y="46" width="28" height="28" rx="6" style="fill:var(--primary);stroke:var(--text);stroke-width:1"/>' +
      '<g transform="translate(53 51) scale(.75)" style="fill:none;stroke:var(--on-primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">' + P.plane + '</g>' +
      '<text x="62" y="92" text-anchor="middle" ' + t + '>' + esc(a.code) + '</text><text x="62" y="106" text-anchor="middle" ' + m + '>' + esc(a.name) + '</text>' +
    '</svg>';
    return '<article class="pdg-card half">' +
      '<div class="spread"><p class="caption muted">Nearest open airport</p>' + badge('success', 'Open') + '</div>' +
      '<h3 class="h4 pdg-card__title">' + esc(a.name) + ' (' + esc(a.code) + ')</h3>' + map +

  // BOOKING CARD: we don't know their booking, so ask for it without blocking.

  // ALERT CARD: one switch so the traveller doesn't have to keep checking.

  /* ---------------- The four cases ---------------- */
  var CASES = {};

  // Shared: what the AI understood, as Trip card chips
  function tripItems(sl) {
    var out = [];
    function place(k) { return cityName(k).replace(' Heathrow', ''); }
    if (CITIES[sl.from]) out.push({ slot: 'from', text: 'From ' + place(sl.from) });
    if (sl.to === 'anywhere') out.push({ slot: 'to', text: 'To anywhere' }); else if (CITIES[sl.to]) out.push({ slot: 'to', text: 'To ' + place(sl.to) });
    if (sl.date) out.push({ slot: 'date', text: sl.date + (sl.dates && sl.dates.assumedYear ? ' (year assumed)' : '') });
    out.push({ slot: 'pax', text: sl.pax ? sl.pax.total + (sl.pax.total > 1 ? ' travellers' : ' traveller') : '1 adult' });

  }
  function needItems(nd) {
    var out = [];
    if (!nd) return out;
    if (nd.deadline) out.push({ id: 'deadline', text: 'Land by ' + nd.deadline.label });
    if (nd.wheelchair) out.push({ id: 'wheelchair', text: 'Wheelchair assistance' });
    if (nd.pet) out.push({ id: 'pet', text: 'Travelling with a pet' });
    if (nd.budget) out.push({ id: 'budget', text: 'Under £' + nd.budget + ' each' });

  }
  function trip(sl) { return tripCard(tripItems(sl), needItems(sl.needs)); }

  // Rule A + Rule C: apply needs we have no card for, and keep groups together.
  // Never drop a need silently: if no flight meets it, keep the flights and say so.
  function applyNeeds(flights, sl, opts) {
    var nd = sl.needs || {}, px = sl.pax || { total: 1 }, said = [];
    // step(test, what we did, why some were left out, what to say if nothing passes, fact to add)
    function step(test, ok, none, factTxt) {
      var keep = flights.filter(test);
      if (!keep.length) { said.push(none); return; }
      var gone = flights.length - keep.length;
      said.push(ok[0] + (gone ? ' I left out ' + gone + (gone > 1 ? ' flights ' : ' flight ') + ok[1] + '.' : ''));
      flights = keep;
      if (factTxt) flights.forEach(function (f) { f.facts = [fact(factTxt[0], typeof factTxt[1] === 'function' ? factTxt[1](f) : factTxt[1])].concat(f.facts || []); });
    }
    if (px.total > 1) step(function (f) { return (f.seats || 99) >= px.total; },
      ['Showing flights with ' + px.total + ' seats together.', 'without enough seats'], 'No flight has ' + px.total + ' seats together, so these may split your group. Call us to hold group seats.',
      ['seat', 'Seats for ' + px.total + ' together']);
    if (nd.wheelchair) step(function (f) { return f.assist !== false; }, ['Every flight here has wheelchair assistance.', 'without it'], 'None of these flights confirm wheelchair assistance yet. Ask the airline before you book.', ['seat', 'Wheelchair assistance available']);
    if (nd.pet) step(function (f) { return !!f.pets; }, ['Showing flights that take pets in the cabin.', 'that don\'t'], 'None of these flights take pets in the cabin. You may need a pet transport service.', ['tag', 'Pets allowed in the cabin']);
    if (nd.budget) step(function (f) { return f.price <= nd.budget; }, ['Showing flights under £' + nd.budget + ' each.', 'over budget'], 'Nothing is under £' + nd.budget + ' each, so here are the closest prices.', null);

      step(by, ['Showing flights that land by ' + nd.deadline.label + ', earliest arrival first.', 'that land later'], 'No flight lands by ' + nd.deadline.label + '. These are the earliest arrivals.', null);
      flights.sort(function (a, b) { return addMin(a.dep, a.mins) - addMin(b.dep, b.mins); });
      flights.forEach(function (f) { if (by(f)) f.badges = [badge('success', 'Lands in time')]; });

  }

  // 1. BASELINE: a complete search (from, to, when). Just the common factor, sorted best first.
  CASES.baseline = function (t, ctx) {
    var sl = (ctx && ctx.slots) || slotsOf(t);
    var fromK = CITIES[sl.from] ? sl.from : 'london';
    var toK = CITIES[sl.to] ? sl.to : 'lisbon';
    var from = CITIES[fromK], to = CITIES[toK];
    if (fromK === toK) { from = CITIES[toK === 'edinburgh' ? 'london' : 'edinburgh']; }
    var mins = Math.abs(to[2] - from[2]) + (fromK === 'london' || toK === 'london' ? 0 : 60) || 75;
    var dates = sl.dates || { start: at(1, '00:00') };
    var day = Math.max(dayDiff(dates.start), dates.flexible ? 1 : 0);
    var px = sl.pax || { total: 1, label: '' };
    var base = Math.round(35 + mins * 0.45);
    function total(price) { return px.total > 1 ? [fact('tag', '£' + (price * px.total) + ' for ' + px.total + ' travellers')] : []; }
    var f = function (o, back) {
      o.from = back ? [to[0], to[1]] : [from[0], from[1]]; o.to = back ? [from[0], from[1]] : [to[0], to[1]]; return o;
    };
    var all = [
      f({ order: 1, airline: 'Skylark Air', code: 'SK 310', dep: at(day, '06:50'), mins: mins, stops: 0, price: base + 22, seats: 9, assist: true, pets: true, badges: [badge('success', 'Best overall')], facts: [fact('seat', 'Cabin bag included')] }),
      f({ order: 2, airline: 'Northline', code: 'NL 842', dep: at(day, '11:40'), mins: mins + 5, stops: 0, price: base + 38, seats: 40, assist: true, pets: false, facts: [fact('seat', 'Cabin bag included')] }),
      f({ order: 3, airline: 'Coastal Jet', code: 'CJ 117', dep: at(day, '06:05'), mins: mins + 95, stops: 1, via: 'AMS', price: base, seats: 25, assist: false, pets: false, badges: [badge('neutral', 'Cheapest')], facts: [fact('clock', '1 h 10 min connection')] }),
      f({ order: 4, airline: 'Skylark Air', code: 'SK 318', dep: at(day, '18:55'), mins: mins, stops: 0, price: base + 61, seats: 3, assist: true, pets: true, facts: [fact('seat', '3 seats left')] })
    ];
    var opts = {};
    var res = applyNeeds(all, sl, opts), flights = res.flights;
    flights.forEach(function (x) { x.facts = total(x.price).concat(x.facts); });
    flights[0].primary = true;
    var who = px.total > 1 ? ' for ' + px.total + ' travellers (' + px.label + ')' : '';
    var when = dayLabel(flights[0].dep).replace(/^(Today|Tomorrow), /, '');
    var count = flights.length === 1 ? '1 flight' : flights.length + ' flights';
    var note = 'Here ' + (flights.length === 1 ? 'is ' : 'are ') + count + ' from ' + from[1] + ' to ' + to[1] + ' on ' + when + who + '. ' + (opts.sorted ? '' : 'Best overall is first. ') + res.said.join(' ');
    if (dates.end) note += ' Return flights on ' + dayLabel(dates.end).replace(/^(Today|Tomorrow), /, '') + ' are below.';
    if (dates.assumedYear) note += ' I\'ve taken your dates as ' + dates.start.getFullYear() + ', the next time they come round.';
    if (px.total >= 10) note += ' Group bookings of 10 or more can hold seats for 48 hours.';
    else if (px.senior || px.child || px.infant || px.student) note += ' Seats together' + (px.senior ? ' and assistance' : '') + ' can be added when you book.';
    var out = [aiNote(note), trip(sl), groupLabel(from[1] + ' → ' + to[1], 'Outbound · ' + dayLabel(flights[0].dep), flights.length > 1 ? (opts.sorted || 'best') : null)].concat(flights.map(function (x) { return flightCard(x); }));
    if (dates.end) {
      var rd = Math.max(dayDiff(dates.end), day);
      var back = applyNeeds([
        f({ order: 1, airline: 'Skylark Air', code: 'SK 311', dep: at(rd, '10:20'), mins: mins, stops: 0, price: base + 18, seats: 12, assist: true, pets: true, badges: [badge('success', 'Best overall')], facts: [fact('seat', 'Cabin bag included')] }, true),
        f({ order: 2, airline: 'Northline', code: 'NL 845', dep: at(rd, '16:45'), mins: mins + 5, stops: 0, price: base + 9, seats: 38, assist: true, pets: false, badges: [badge('neutral', 'Cheapest')], facts: [fact('seat', 'Cabin bag included')] }, true)
      ], sl, { noDeadline: true }).flights;
      back.forEach(function (x) { x.facts = total(x.price).concat(x.facts); });
      back[0].primary = true;
      out = out.concat([groupLabel(to[1] + ' → ' + from[1], 'Return · ' + dayLabel(back[0].dep), back.length > 1 ? 'best' : null)]).concat(back.map(function (x) { return flightCard(x); }));
    }
    return out;
  };

  /* ---------------- Places for emergencies: your airport and the next nearest one ---------------- */
  var NEAR = {
    edinburgh: { home: ['EDI', 'Edinburgh Airport'], alt: ['GLA', 'Glasgow'], miles: 47, drive: '1 h 10 min', road: 'M8', roadNote: 'M8 open, slow near Harthill' },
    glasgow: { home: ['GLA', 'Glasgow Airport'], alt: ['EDI', 'Edinburgh'], miles: 47, drive: '1 h 10 min', road: 'M8', roadNote: 'M8 open, slow near Harthill' },
    london: { home: ['LHR', 'Heathrow'], alt: ['STN', 'London Stansted'], miles: 52, drive: '1 h 15 min', road: 'M25', roadNote: 'M25 open, busy near the M11' },
    manchester: { home: ['MAN', 'Manchester Airport'], alt: ['LPL', 'Liverpool'], miles: 35, drive: '55 min', road: 'M62', roadNote: 'M62 open, slow near Warrington' },
    paris: { home: ['CDG', 'Charles de Gaulle'], alt: ['ORY', 'Paris Orly'], miles: 30, drive: '50 min', road: 'A86', roadNote: 'A86 open' },
    amsterdam: { home: ['AMS', 'Schiphol'], alt: ['RTM', 'Rotterdam'], miles: 40, drive: '55 min', road: 'A4', roadNote: 'A4 open' }
  };
  function nearOf(k) {
    if (NEAR[k]) return NEAR[k];

    var alt = [n.alt[0], n.alt[1]];
    var d1 = soon(150), d2 = soon(190), d3 = soon(245);
    var flights;
    if (CITIES[sl.to] && sl.to !== youK) {
      var to = mkPlace(sl.to), m = flightMins(youK, sl.to);
      flights = [
        { airline: 'Northline', code: 'NL 207', from: alt, to: to, dep: d1, mins: m, stops: 0, price: 164, primary: true, badges: [badge('success', 'Next you can make'), badge('warning', '4 seats left')], facts: [fact('clock', 'Leaves in ' + until(d1)), fact('alert', 'Check-in closes ' + hm(addMin(d1, -45)))] },
        { airline: 'Skylark Air', code: 'SK 552', from: alt, to: to, dep: d2, mins: m + 85, stops: 1, via: 'AMS', price: 131, badges: [badge('neutral', '11 seats left')], facts: [fact('clock', 'Leaves in ' + until(d2))] },
        { airline: 'Coastal Jet', code: 'CJ 390', from: alt, to: to, dep: d3, mins: m + 5, stops: 0, price: 98, badges: [badge('neutral', '20+ seats left')], facts: [fact('clock', 'Leaves in ' + until(d3))] }
      ];
    } else {
      var dests = ['london', 'amsterdam', 'dublin', 'paris'].filter(function (k) { return k !== youK; }).slice(0, 3);

          badges: i === 0 ? [badge('success', 'Next you can make'), badge('warning', '4 seats left')] : [badge('neutral', ['', '11 seats left', '20+ seats left'][i])],
          facts: [fact('clock', 'Leaves in ' + until(dep)), i === 0 ? fact('alert', 'Check-in closes ' + hm(addMin(dep, -45))) : fact('plane', 'Onward connections ' + (i === 1 ? 'tonight' : 'tomorrow'))] };

  // What's causing the disruption, from the traveller's own words. Weather is the default.
  function causeOf(t) {

    if (/\bstrike\b/.test(t)) return { why: 'a strike', icon: 'alert', body: 'Staff are on strike today. Departures are expected to restart tomorrow morning, but this may change.' };
    if (/\b(fog|snow)\b/.test(t)) return { why: 'the weather', icon: 'wind', body: 'Low visibility on the runway. Departures are expected to restart around 22:00, but this may change.' };

  }

  // 2b. EMERGENCY, NO FLIGHT WORKS: only now try other transport, a hotel nearby and safety.

      ] }),

    var home = mkPlace(fromK);

      ['krakow', 19, at(2, '06:10'), 'lt', 'Skylark Air', 'SK 770', 'Cabin bag costs extra.'], ['amsterdam', 84, soon(130), 'hr', 'Northline', 'NL 120', ''],
      ['porto', 27, at(1, '06:30'), 'st', 'Coastal Jet', 'CJ 731', ''], ['dublin', 34, soon(260), 'gw', 'Northline', 'NL 618', ''],
      ['barcelona', 41, at(1, '09:10'), 'gw', 'Skylark Air', 'SK 904', ''], ['nice', 58, at(1, '13:25'), 'hr', 'Coastal Jet', 'CJ 288', ''],
      ['athens', 79, at(2, '07:50'), 'hr', 'Northline', 'NL 402', ''], ['lisbon', 46, at(1, '15:40'), 'gw', 'Skylark Air', 'SK 512', '']

  // QUESTION CARD: exactly one clarifying question, answered with a tap or by typing.

<script id="ek-js">

    edinburgh:  { home: ['EDI', 'Edinburgh Airport'], alt: ['GLA', 'Glasgow'], miles: 47, drive: 70, road: 'M8', roadNote: 'M8 open' },

    manchester: { home: ['MAN', 'Manchester Airport'], alt: ['LPL', 'Liverpool'], miles: 35, drive: 50, road: 'M62', roadNote: 'M62 open' },

    paris:      { home: ['CDG', 'Paris Charles de Gaulle'], alt: ['ORY', 'Paris Orly'], miles: 35, drive: 55, road: 'A6', roadNote: 'A6 open' },

    };
    var opts = [
      { w: 110, air: 'Northline', code: 'NL 715', price: 168, seats: 6 },
      { w: 205, air: 'Skylark Air', code: 'SK 482', price: 139, seats: 14 },
      { w: 320, air: 'Coastal Jet', code: 'CJ 228', price: 112, seats: 22 }
    ];
    var base = Math.max(Math.abs(C[p.via][2] - C[p.dest][2]), 90) + 20;
    var flights = opts.filter(function (o) { return o.w < oldWait; }).map(function (o, i) {
      var dep = T.addMin(land, o.w);
      var f = { order: i + 1, airline: o.air, code: o.code, dep: dep, mins: base, stops: 0, price: o.price, seats: o.seats,
        from: [via[0], via[1]], to: [dest[0], dest[1]], primary: i === 0,
        facts: [K.fact('clock', nice(o.w) + ' wait · saves ' + nice(oldWait - o.w))] };
      if (i === 0) f.badges = [K.badge('success', 'Shortest wait')];
      return f;
    });
    if (!flights.length) {
      return [K.cards.aiNote('Your wait in ' + E(via[1]) + ' is already short, so there is nothing quicker to offer. Add your booking reference and we will check it.'), K.cards.booking()];
    }
    return [
      K.cards.aiNote('Your wait in ' + E(via[1]) + ' is now ' + nice(oldWait) + '. Here are ' + E(via[1]) + ' to ' + E(dest[1]) + ' flights that leave sooner.' + (origin ? ' Your ' + E(origin[1]) + ' flight stays as it is.' : '')),
      K.cards.list(tripNow),
      K.cards.groupLabel(via[1] + ' → ' + dest[1], 'Sooner than your ' + nice(oldWait) + ' wait', null)
    ].concat(flights.map(function (f) { return K.cards.flight(f); })).concat([K.cards.booking()]);
  }
  window.RebookKit = { matches: matches, render: render, fix: fix, plan: plan };
})();
</script>

<script>
/* Home page: show the chat box only. After any search, show the Baseline result and nothing else.
   The Baseline cards come from window.PDGKit.CASES.baseline in kit/pdg-kit.js. */
(function () {
  var K = window.PDGKit;
  var THINK_MS = 900;
  function $(id) { return document.getElementById(id); }
  var form = $('prompt-form'), input = $('prompt'), submit = $('submit');
  var canvas = $('canvas'), query = $('query'), reset = $('reset'), live = $('live'), results = $('results');
  var timer;

  $('today-chip').querySelector('span').textContent =
    'Today, ' + K.time.NOW.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

  function grow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 240) + 'px';
    submit.disabled = !input.value.trim();
  }

  function showQuery(text) {
    query.className = 'query';
    query.innerHTML =
      '<span class="query__avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>' +
      '<div><span class="small query__label">You asked</span><p class="body"></p></div>';
    query.querySelector('p').textContent = text;
    query.hidden = false;
  }

  // The Baseline result for this request. Uses the cities and day in the text when it can
  // (falls back to London to Lisbon, tomorrow). The "Your trip" chips are left out because
  // editing them needs the lab's conversation.
  function baselineCards(text) {
    var html;
    try { html = K.CASES.baseline(text.toLowerCase()); }
    catch (e) { html = K.CASES.baseline('flights from london to lisbon tomorrow'); }
    return html.filter(function (h) { return h.indexOf('class="trip"') === -1; });
  }

  var last = { text: '', missing: null, intent: null };
  function run(text) {
    text = window.RebookKit.fix(text);
    clearTimeout(timer);
    showQuery(text);
    reset.hidden = false;
    results.hidden = false;
    canvas.setAttribute('aria-busy', 'true');
    canvas.innerHTML = '<div class="skeleton"><i></i><i></i><i></i></div>'.repeat(3);
    live.textContent = 'Finding flights…';
    results.scrollIntoView({ behavior: 'smooth', block: 'start' });

    timer = setTimeout(function () {
      // The rules decide. K.route reads the request and picks one rule (see rules.md).
      var d = K.route(text), cards;
      last = { text: text, missing: d.missing, intent: d.intent };
      if (window.RebookKit.matches(text)) {
        // Already booked and the wait got too long: offer sooner flights.
        cards = window.RebookKit.render(text);
        last = { text: text, missing: null, intent: 'rebook' };
      } else if (d.intent === 'emergency' && (d.key === 'emergency' || (d.key === 'ask' && d.missing === 'to'))) {
        // Emergency: no destination needed. Show the fastest way out and let them narrow it later.
        cards = window.EmergencyKit.render(text, d.slots);
      } else {
        // Every other case (emergency with nothing working, spontaneous, simple search, one question, unknown)
        cards = K.render(text).html
          .filter(function (h) { return h.indexOf('class="trip"') === -1; })
          // Editing chips need the lab's conversation, so show them as plain labels here.
          .map(function (h) { return h.replace(/<button type="button" class="known__chip"[^>]*>([\s\S]*?)<\/button>/g, '<span class="known__chip">$1</span>'); });
      }
      canvas.innerHTML = cards.join('');
      // Every question also takes a typed answer, because the buttons can't cover every place.
      Array.prototype.forEach.call(canvas.querySelectorAll('.question'), function (q) {
        var label = { from: 'Where are you flying from?', to: 'Where are you flying to?', date: 'Which day?' }[last.missing] || 'Where would you like to go?';
        q.insertAdjacentHTML('beforeend',
          '<form class="inline-form answer-form" autocomplete="off"><label class="visually-hidden" for="answer-in">' + label + '</label>' +
          '<input class="pdg-input body" id="answer-in" placeholder="Or type it here, like Accra">' +
          '<button class="pdg-btn pdg-btn--secondary body" type="submit">Send</button></form>');
      });
      Array.prototype.forEach.call(canvas.children, function (el, i) {
        el.classList.add('card-in');
        el.style.animationDelay = (i * 60) + 'ms';
        // Drop the entrance animation once done, so re-sorting doesn't replay it.
        el.addEventListener('animationend', function () { el.classList.remove('card-in'); el.style.animationDelay = ''; }, { once: true });
      });
      canvas.removeAttribute('aria-busy');
      live.textContent = canvas.querySelectorAll('.flight, .ek-hero').length + ' options shown';
    }, THINK_MS);
  }

  input.addEventListener('input', grow);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (input.value.trim()) form.requestSubmit(); }
  });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (text) run(text);
  });
  // A typed answer joins the first request, so nothing the traveller already said is lost.
  canvas.addEventListener('submit', function (e) {
    var f = e.target.closest && e.target.closest('.answer-form');
    if (!f) return;
    e.preventDefault();
    var v = f.querySelector('input').value.trim();
    if (!v) return;
    var glue = { from: last.intent === 'emergency' ? ' in ' : ' from ', to: ' to ', date: ' on ' }[last.missing];
    var next;
    if (glue) next = last.text + glue + v;
    else next = K.findCity(v.toLowerCase()) ? 'flights to ' + v : v;
    input.value = next; grow();
    run(next);
  });
  // Tapping an answer or an example runs it as the next request.
  canvas.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-run]');
    if (!b) return;
    input.value = b.getAttribute('data-run'); grow();
    run(input.value.trim());
  });
  canvas.addEventListener('change', function (e) {
    if (e.target.classList.contains('sort-select')) K.sortRun(e.target);
  });
  reset.addEventListener('click', function () {
    clearTimeout(timer);
    input.value = ''; grow();
    query.hidden = true;
    reset.hidden = true;
    results.hidden = true;
    canvas.removeAttribute('aria-busy');
    canvas.innerHTML = '';
    live.textContent = '';
    input.focus();
  });
  grow();
})();
</script>
</body>
</html>
